packages:
  - packages/*

# Supply-chain guard: skip package versions published in the last 7 days (in minutes).
minimumReleaseAge: 10080

# No dependency needs its install script: esbuild ships its binary as an optional package.
allowBuilds:
  '@google/genai': false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
