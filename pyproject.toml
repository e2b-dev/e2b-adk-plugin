[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e2b-adk"
version = "0.1.0"
description = "Google ADK plugin backed by E2B sandboxes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "e2b-adk contributors" }]
keywords = ["e2b", "adk", "google-adk", "sandbox", "agent", "code-interpreter"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "e2b-code-interpreter==2.8.1",
    "google-adk==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "build",
]
examples = [
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["e2b_adk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

# Third-party SDKs ship without type stubs / py.typed markers. They also
# re-export public names through their package __init__ without an explicit
# __all__, so allow those implicit re-exports rather than reaching into
# private submodules.
[[tool.mypy.overrides]]
module = ["e2b_code_interpreter.*", "google.adk.*", "google.genai.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real E2B/Gemini APIs (billable); excluded by default — run with `pytest -m live`",
]
